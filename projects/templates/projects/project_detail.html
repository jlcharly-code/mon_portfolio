{% extends "base.html" %}

{% block page_content %}
<h1>{{ project.title }}</h1>
<div class="row">
    <div class="col-md-8">
        {% if project.image %}
        <img src="{{ project.image.url }}" width="100%">
        {% endif %}

        {% if project.url %}
         <a href="{{ project.url }}" target="_blank">Voir le projet en ligne</a>
        {% endif %}
    </div>

    <div class="col-md-4">
        <h5>description:</h5>
        <p>{{ project.description }}</p>
        <br>
        <h5>Technologie utilisée:</h5>
        <p>{{ project.technology }}</p>
    </div>
</div>
{% endblock page_content %}
