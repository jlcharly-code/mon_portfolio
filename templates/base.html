<!DOCTYPE html>
<html lang="fr">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mon Portfolio{% endblock title %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <div class="nav-logo">
            <span class="logo-text">Jean-Luc</span>
        </div>
        <ul class="nav-menu">
            <li><a href="{% url 'home' %}" class="nav-link">Accueil</a></li>
            <li><a href="{% url 'project_index' %}" class="nav-link">Projets</a></li>
            <li><a href="#contact" class="nav-link">Contact</a></li>
        </ul>
        <div class="nav-actions">
            <button class="theme-toggle" id="themeToggle" aria-label="Changer de thème">
                <i class="fa-solid fa-moon"></i>
            </button>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>
</nav>

{% block page_content %}{% endblock page_content %}

<footer class="footer">
    <p>&copy; {% now "Y" %} Jean-Luc Charlier. Tous droits réservés.</p>
</footer>

<script src="{% static 'js/theme.js' %}"></script>
</body>
</html>
